<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月次マネーレポート（家計×恩株）</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#27364b;--line:#334155;--text:#e2e8f0;
    --muted:#94a3b8;--accent:#38bdf8;--gold:#fcd34d;--green:#34d399;--red:#f87171;--blue:#818cf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.6;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0 0 2px}
  h2{font-size:15px;margin:22px 0 8px;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .dropzone{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;
    margin-bottom:14px;background:var(--card);transition:.15s}
  .dropzone.over{border-color:var(--accent);background:#15233a}
  .dz-big{font-size:16px;font-weight:700;color:var(--text)}
  .dz-sub{font-size:12px;color:var(--muted);margin-top:6px}
  .dz-pick{color:var(--accent);text-decoration:underline;cursor:pointer}
  .dz-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2)}
  .chip.ok{border-color:var(--green);color:var(--green)}
  .chip.warn{border-color:var(--red);color:var(--red)}
  .filebox{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:11px}
  .filebox.ok{border-color:var(--green);border-style:solid}
  .filebox h3{margin:0 0 3px;font-size:13px}.filebox p{margin:0;font-size:11px;color:var(--muted)}
  input[type=file]{font-size:12px;color:var(--muted);width:100%;margin-top:6px}
  .kpi{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:760px){.kpi{grid-template-columns:repeat(4,1fr)}}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .box .l{color:var(--muted);font-size:11px}.box .v{font-size:20px;font-weight:700;margin-top:2px}
  .box .v small{font-size:11px;color:var(--muted);font-weight:400}
  .pos{color:var(--green)}.neg{color:var(--red)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .form{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .form label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
  .form input{background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px;font-size:14px}
  .btn{background:var(--accent);color:#06283d;border:none;border-radius:8px;padding:9px 14px;
    font-weight:700;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11px}
  .empty{color:var(--muted);text-align:center;padding:32px;border:1px dashed var(--line);border-radius:12px}
  .muted{color:var(--muted);font-size:12px}
  .row2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .printbtn{float:right}
  @media print{body{background:#fff;color:#000}.drop,.no-print,input[type=file]{display:none!important}
    .box,.panel{border-color:#ccc;background:#fff}h2{color:#333}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 月次マネーレポート <span class="muted" id="ym-title"></span></h1>
  <div class="sub">毎月初に、先月ダウンロードしたCSV（SBIの保有証券・配当履歴、マネーフォワードの収支など）を<b>まとめてここにドロップするだけ</b>。種類を自動判別し、<b>先月のレポートを自動生成・自動記録</b>します。最後に<b>「✉️ Gmailで下書き作成」</b>を押せば、サマリー入りのメール下書きがワンクリックで開きます。推移はブラウザ内に積み上がります。</div>

  <div id="dropzone" class="dropzone no-print">
    <div class="dz-big">⬇ ここに今月DLしたCSVをまとめてドロップ</div>
    <div class="dz-sub">または <label class="dz-pick">ファイルを選ぶ<input type="file" id="f-multi" accept=".csv" multiple hidden></label>　／　保有証券一覧・配当履歴(DISTRIBUTION)・マネーフォワード収支 などをまとめて可</div>
    <div id="filelist" class="dz-list"></div>
  </div>

  <div id="dash"><div class="empty">CSVをドロップすると、先月のレポートが自動で作成されます。</div></div>
</div>

<script>
"use strict";
var SNAPKEY="mmr_snapshots", DATA={hold:null,div:null,mf:null,files:[]}, targetYM=null;
function prevMonthYM(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function detectType(rows){
  if(rows.some(function(r){return r.length>=2&&r[0]=="受渡日"&&r[1]=="口座";}))return "div";
  var head=rows.slice(0,8).map(function(r){return r.join("|");}).join("\n");
  if(/保有証券一覧|株式（特定預り|株式（NISA/.test(head))return "hold";
  if(rows.some(function(r){return r.indexOf("日付")>=0&&r.some(function(c){return /金額/.test(c);})&&(r.indexOf("大項目")>=0||r.indexOf("振替")>=0);}))return "mf";
  if(rows.some(function(r){return r[0]=="約定日";}))return "trade";
  return "unknown";
}
function kindLabel(k){return {hold:"保有証券一覧",div:"配当履歴",mf:"MF収支",trade:"約定履歴(未使用)",unknown:"判別不可"}[k]||k;}
function decode(b){return new TextDecoder("shift_jis").decode(b);}
function parseCSV(t){var R=[],r=[],c="",q=false,i,ch;for(i=0;i<t.length;i++){ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else{if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'){r.push(c);R.push(r);r=[];c=""}else if(ch=='\r'){}else c+=ch}}
  if(c!==""||r.length){r.push(c);R.push(r)}return R;}
function n(s){return parseFloat(String(s).replace(/[+,\s]/g,""))||0;}
function yen(v){return Math.round(v).toLocaleString("ja-JP");}
function man(v){return (v/10000).toLocaleString("ja-JP",{maximumFractionDigits:1});}
function p1(v){return (Math.round(v*10)/10).toFixed(1);}
function sign(v){return (v>=0?"+":"")+yen(v);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function mailAddr(){return localStorage.getItem("mmr_email")||"ph2144.tt.0609@gmail.com";}
function buildMail(ym,M,inc,exp){
  var top=DATA.hold.stocks.map(function(s){return {n:s.name,p:(DATA.div.life[s.code]||0)/s.cost*100};})
    .sort(function(a,b){return b.p-a.p;}).slice(0,3).map(function(x){return x.n+" "+p1(x.p)+"%";}).join(" / ");
  var dm=DATA.div.byMonth[ym]?DATA.div.byMonth[ym].dom+DATA.div.byMonth[ym].us:0, bal=(inc||0)-(exp||0);
  var L=["家計簿 月次レポート "+ym,"",
    "■資産","リスク資産 評価額: "+yen(M.asset)+"円",
    "含み損益: "+sign(M.unreal)+"円 ("+(M.unreal>=0?"+":"")+p1(M.unreal/(M.asset-M.unreal||1)*100)+"%)",
    "恩株 達成度: "+p1(M.onkabu)+"%（残り "+(M.remYears===Infinity?"—":p1(M.remYears))+"年）","",
    "■配当(税引後)",ym+"の配当: "+yen(dm)+"円",parseInt(ym)+"年累計: "+yen(M.divYTD)+"円","生涯累計: "+yen(M.lifeDiv)+"円","",
    "■恩株トップ3",top,"",
    "■家計",(inc||exp)?("収入 "+yen(inc)+" / 支出 "+yen(exp)+" / 収支 "+sign(bal)+"円"):"(マネーフォワード未取込)","",
    "※詳細グラフは monthly_report.html"].filter(function(x){return x!==null;});
  var su="【家計簿レポート】"+ym+" 資産"+man(M.asset)+"万・恩株"+p1(M.onkabu)+"%";
  return "https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(mailAddr())+
    "&su="+encodeURIComponent(su)+"&body="+encodeURIComponent(L.join("\n"));
}

function parseHoldings(rows){
  var stocks=[],funds=[],acct=null,inT=false,sec="";
  rows.forEach(function(r){
    var line=r.join(","),lone=r.filter(function(x){return x;}).length<=1;
    if(lone&&/株式（特定/.test(line)){acct="特定";inT=false;}
    else if(lone&&/株式（NISA/.test(line)){acct="NISA";inT=false;}
    else if(lone&&/投資信託/.test(line)&&!/合計/.test(line)){inT=true;acct=null;sec=r[0].replace(/投資信託（金額\/?/,"").replace(/）$/,"");}
    if(acct&&/^\d{4}$/.test((r[0]||"").trim())&&r.length>=8)
      stocks.push({code:r[0].trim(),name:r[1].trim(),sh:n(r[2]),avg:n(r[4]),cost:n(r[6]),val:n(r[7]),acct:acct});
    if(inT&&r[0]&&r[0]!=="ファンド名"&&/口/.test(r[1]||"")&&n(r[5])>0)
      funds.push({name:r[0].trim(),cost:n(r[5]),val:n(r[6]),sec:sec});
  });
  return {stocks:stocks,funds:funds};
}
function parseDiv(rows){
  var hi=rows.findIndex(function(r){return r.length>=2&&r[0]=="受渡日"&&r[1]=="口座";});
  var life={},byYear={},byMonth={},all=0,ttm={},first={},recs=[],maxk=0;
  for(var i=hi+1;i<rows.length;i++){var r=rows[i];
    if(r.length<6||!r[0])continue;
    var p=r[0].split("/"),y=+p[0],k=y*10000+(+p[1])*100+(+p[2]);
    var v=n(r[5]),cat=/信用/.test(r[2])?"cr":/米国/.test(r[2])?"us":"dom";
    byYear[y]=byYear[y]||{dom:0,us:0,cr:0};byYear[y][cat]+=v;all+=v;
    if(cat!="cr"){
      var ym=p[0]+"-"+String(p[1]).padStart(2,"0");
      byMonth[ym]=byMonth[ym]||{dom:0,us:0};byMonth[ym][cat]+=v;
      var m=(r[3]||"").match(/(\d{4})$/);if(m){life[m[1]]=(life[m[1]]||0)+v;
        recs.push({code:m[1],k:k,v:v});if(k>maxk)maxk=k;
        if(!first[m[1]]||k<first[m[1]])first[m[1]]=k;}}
  }
  var cut=(Math.floor(maxk/10000)-1)*10000+(maxk%10000);
  recs.forEach(function(x){if(x.k>=cut)ttm[x.code]=(ttm[x.code]||0)+x.v;});
  return {life:life,byYear:byYear,byMonth:byMonth,all:all,ttm:ttm,first:first};
}
function parseMF(rows){
  var hi=-1;
  for(var i=0;i<rows.length;i++){if(rows[i].indexOf("日付")>=0&&rows[i].some(function(c){return /金額/.test(c);})){hi=i;break;}}
  if(hi<0)return null;
  var H=rows[hi],di=H.indexOf("日付"),ai=H.findIndex(function(c){return /金額/.test(c);}),
      ki=H.indexOf("計算対象"),fi=H.indexOf("振替");
  var byMonth={},cnt=0;
  for(var j=hi+1;j<rows.length;j++){var r=rows[j];if(!r[di])continue;
    if(ki>=0&&String(r[ki]).trim()==="0")continue;
    if(fi>=0&&String(r[fi]).trim()==="1")continue;
    var dt=r[di].replace(/-/g,"/").split("/");if(dt.length<2)continue;
    var ym=dt[0]+"-"+String(parseInt(dt[1])).padStart(2,"0"),amt=n(r[ai]);
    var b=byMonth[ym]||(byMonth[ym]={income:0,expense:0});
    if(amt>=0)b.income+=amt;else b.expense+=-amt;cnt++;
  }
  return {byMonth:byMonth,count:cnt};
}
function yearsSince(k){if(!k)return null;var y=Math.floor(k/10000),mo=Math.floor(k/100)%100,d=k%100;
  return (Date.now()-new Date(y,mo-1,d).getTime())/(365.25*864e5);}
function snaps(){try{return JSON.parse(localStorage.getItem(SNAPKEY))||{}}catch(e){return{}}}
function saveSnaps(o){localStorage.setItem(SNAPKEY,JSON.stringify(o));}

// ---- SVG charts ----
function barChart(data,opt){ // data:[{label,segs:[{v,color}],total}]
  opt=opt||{};var W=opt.w||640,H=opt.h||180,pad=28,bw=Math.min(54,(W-pad*2)/data.length-12);
  var max=Math.max.apply(null,data.map(function(d){return d.total;}).concat([1]));
  var g="",x0=pad+10;
  data.forEach(function(d,i){
    var x=pad+ (i+0.5)*((W-pad*2)/data.length), y=H-22, acc=0;
    d.segs.forEach(function(s){var h=(H-46)*(s.v/max);y-=h;
      g+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(0,h)+'" fill="'+s.color+'" rx="2"/>';});
    g+='<text x="'+x+'" y="'+(H-6)+'" fill="#94a3b8" font-size="11" text-anchor="middle">'+esc(d.label)+'</text>';
    g+='<text x="'+x+'" y="'+(y-4)+'" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="700">'+(d.top!=null?d.top:man(d.total))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+g+'</svg>';
}
function lineChart(pts,opt){ // pts:[{label,v}]
  opt=opt||{};var W=opt.w||640,H=opt.h||180,pad=34;
  if(!pts.length)return '<div class="muted">記録がまだありません。「今月を記録」で積み上がります。</div>';
  var vals=pts.map(function(p){return p.v;}),max=Math.max.apply(null,vals),min=Math.min.apply(null,vals.concat([0]));
  if(max==min)max=min+1;
  var X=function(i){return pad+(pts.length<=1?(W-pad*2)/2:i*(W-pad*2)/(pts.length-1));};
  var Y=function(v){return H-24-(H-44)*((v-min)/(max-min));};
  var d="",dots="";
  pts.forEach(function(p,i){d+=(i?"L":"M")+X(i)+" "+Y(p.v)+" ";
    dots+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="3" fill="'+(opt.color||"#38bdf8")+'"/>'+
      '<text x="'+X(i)+'" y="'+(Y(p.v)-7)+'" fill="#e2e8f0" font-size="10" text-anchor="middle">'+(opt.fmt?opt.fmt(p.v):p.v)+'</text>'+
      '<text x="'+X(i)+'" y="'+(H-8)+'" fill="#94a3b8" font-size="10" text-anchor="middle">'+esc(p.label)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<path d="'+d+'" fill="none" stroke="'+(opt.color||"#38bdf8")+'" stroke-width="2"/>'+dots+'</svg>';
}

function curMetrics(yr){
  yr=yr||new Date().getFullYear();
  var H=DATA.hold,D=DATA.div;
  var sc=0,sv=0,lifeHeld=0,ttmHeld=0,heldSum=0,heldCnt=0;
  H.stocks.forEach(function(s){sc+=s.cost;sv+=s.val;lifeHeld+=(D?D.life[s.code]||0:0);
    ttmHeld+=(D?D.ttm[s.code]||0:0);
    var hy=D?yearsSince(D.first[s.code]):null;if(hy!=null){heldSum+=hy;heldCnt++;}});
  var fc=0,fv=0;H.funds.forEach(function(f){fc+=f.cost;fv+=f.val;});
  var divY=D&&D.byYear[yr]?(D.byYear[yr].dom+D.byYear[yr].us):0;
  return {stockCost:sc,stockVal:sv,fundCost:fc,fundVal:fv,asset:sv+fv,
    lifeHeld:lifeHeld,onkabu:sc?lifeHeld/sc*100:0,divYTD:divY,lifeDiv:D?D.all:0,unreal:(sv-sc)+(fv-fc),
    ttmHeld:ttmHeld,remYears:ttmHeld>0?Math.max(0,(sc-lifeHeld)/ttmHeld):Infinity,
    avgHeld:heldCnt?heldSum/heldCnt:null};
}
function ymNow(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}

function render(){
  renderFileList();
  var dash=document.getElementById("dash");
  if(!DATA.hold||!DATA.div){dash.innerHTML='<div class="empty">CSVをドロップすると先月レポートを自動作成します。'+
    (DATA.files.length?'（'+(DATA.hold?'':'保有証券一覧 ')+(DATA.div?'':'配当履歴 ')+'が不足）':'')+'</div>';return;}
  if(!targetYM)targetYM=prevMonthYM();
  var ym=targetYM,D=DATA.div,M=curMetrics(parseInt(ym));
  document.getElementById("ym-title").textContent="／ "+ym+" 分";

  // KPIs
  var kpi='<div class="kpi">'+
    box("リスク資産 評価額",man(M.asset)+'<small> 万円</small>')+
    box("含み損益",'<span class="'+(M.unreal>=0?"pos":"neg")+'">'+sign(M.unreal)+'</span><small> 円</small>')+
    box("恩株 達成度",p1(M.onkabu)+'<small> %</small>')+
    box("今年の配当(税引後)",yen(M.divYTD)+'<small> 円</small>')+
    box("恩株まで残り(現配当維持)",(M.remYears===Infinity?"—":p1(M.remYears))+'<small> 年</small>')+
    box("平均 保有年数",(M.avgHeld==null?"—":p1(M.avgHeld))+'<small> 年(初回配当〜)</small>')+
    box("生涯配当 累計(税引後)",yen(M.lifeDiv)+'<small> 円</small>')+
    box("直近1年の配当(保有分)",yen(M.ttmHeld)+'<small> 円</small>')+
  '</div>';

  // 年別配当 chart
  var years=Object.keys(D.byYear).sort();
  var bars=years.map(function(y){var b=D.byYear[y];return {label:y,total:b.dom+b.us,
    segs:[{v:b.dom,color:"#38bdf8"},{v:b.us,color:"#818cf8"}]};});
  var divChart='<div class="panel"><h2 style="margin-top:0">年別 受取配当（税引後・万円）</h2>'+
    barChart(bars,{h:190})+
    '<div class="muted"><span style="color:#38bdf8">■</span>国内株 <span style="color:#818cf8">■</span>米国株／生涯合計 '+yen(D.all)+'円</div></div>';

  // 月別 受取配当の推移（国内+米国 合算・直近12ヶ月）
  var dmk=Object.keys(D.byMonth).sort().slice(-12);
  var divM=dmk.map(function(k){var b=D.byMonth[k];return {label:k.slice(2),total:b.dom+b.us,
    segs:[{v:b.dom,color:"#38bdf8"},{v:b.us,color:"#818cf8"}]};});
  var divMonthChart='<div class="panel"><h2 style="margin-top:0">月別 受取配当の推移（直近12ヶ月・万円）</h2>'+
    (dmk.length?barChart(divM,{h:170}):'<div class="muted">—</div>')+
    '<div class="muted"><span style="color:#38bdf8">■</span>国内株 <span style="color:#818cf8">■</span>米国株</div></div>';

  // 家計入力（MF自動入力対応・対象月=先月）
  var sn=snaps(),cur=sn[ym]||{};
  var mfm=DATA.mf&&DATA.mf.byMonth[ym];
  var incV=cur.income!=null?cur.income:(mfm?Math.round(mfm.income):"");
  var expV=cur.expense!=null?cur.expense:(mfm?Math.round(mfm.expense):"");
  var autoNote=cur.auto?'<div class="muted" style="margin-top:6px;color:var(--green)">✓ '+ym+' を自動記録しました（CSV読込時）。数値を直したら「再記録」を押してください。</div>':'';
  var mfNote=DATA.mf?'<div class="muted" style="margin-top:4px;color:var(--green)">✓ マネーフォワード取込済み（'+Object.keys(DATA.mf.byMonth).length+'ヶ月分・明細'+DATA.mf.count+'件、振替/対象外は除外）</div>':'<div class="muted" style="margin-top:4px">MF収支CSVをドロップすると収入・支出を自動入力します（未取込なら手入力）</div>';
  var budget='<div class="panel"><h2 style="margin-top:0">対象月の家計（'+ym+'）</h2>'+
    '<div class="form no-print">'+
      '<label>対象月（既定=先月）<input type="month" id="i-ym" value="'+ym+'"></label>'+
      '<label>収入(円)<input type="number" id="i-inc" value="'+incV+'" placeholder="例 450000"></label>'+
      '<label>支出(円)<input type="number" id="i-exp" value="'+expV+'" placeholder="例 280000"></label>'+
      '<button class="btn" id="b-save">再記録</button>'+
      '<button class="btn ghost" id="b-del">この月を削除</button>'+
    '</div>'+autoNote+mfNote+
    '<div id="budget-sum" class="muted" style="margin-top:8px"></div></div>';

  // 推移チャート
  var keys=Object.keys(sn).sort();
  var assetPts=keys.map(function(k){return {label:k.slice(2),v:sn[k].asset||0};});
  var onkPts=keys.map(function(k){return {label:k.slice(2),v:sn[k].onkabu||0};});
  // 月次収支：MFがあれば全月、無ければ記録から
  var balData;
  if(DATA.mf){balData=Object.keys(DATA.mf.byMonth).sort().slice(-12).map(function(k){
    var b=DATA.mf.byMonth[k],bal=b.income-b.expense;
    return {label:k.slice(2),total:Math.abs(bal),top:(bal>=0?"+":"−")+man(Math.abs(bal)),
      segs:[{v:Math.abs(bal),color:bal>=0?"#34d399":"#f87171"}]};});}
  else{balData=keys.map(function(k){var bal=(sn[k].income||0)-(sn[k].expense||0);
    return {label:k.slice(2),total:Math.abs(bal),top:(bal>=0?"+":"−")+man(Math.abs(bal)),
      segs:[{v:Math.abs(bal),color:bal>=0?"#34d399":"#f87171"}]};});}
  var hasBal=balData.length>0;
  var trends='<div class="row2">'+
    '<div class="panel"><h2 style="margin-top:0">恩株 達成度の推移（%）</h2>'+lineChart(onkPts,{color:"#fcd34d",fmt:function(v){return p1(v);}})+'</div>'+
    '<div class="panel"><h2 style="margin-top:0">リスク資産の推移（株+投信・万円）</h2>'+lineChart(assetPts.map(function(p){return{label:p.label,v:p.v/10000};}),{color:"#38bdf8",fmt:function(v){return Math.round(v);}})+'</div>'+
  '</div>'+
  '<div class="panel"><h2 style="margin-top:0">月次 収支の推移（万円）'+(DATA.mf?'<span class="muted" style="font-weight:400">／MFより</span>':'')+'</h2>'+
    (hasBal?barChart(balData,{h:160}):'<div class="muted">家計を記録（またはMF取込）すると表示されます。</div>')+'</div>';

  // 記録テーブル
  var tbl='';
  if(keys.length){tbl='<div class="panel"><h2 style="margin-top:0">記録一覧</h2><table>'+
    '<tr><th>月</th><th>リスク資産</th><th>恩株%</th><th>今年配当</th><th>収入</th><th>支出</th><th>収支</th></tr>'+
    keys.slice().reverse().map(function(k){var s=sn[k];var bal=(s.income||0)-(s.expense||0);
      return '<tr><td>'+k+'</td><td>'+yen(s.asset||0)+'</td><td>'+p1(s.onkabu||0)+'</td><td>'+yen(s.divYTD||0)+
        '</td><td>'+(s.income?yen(s.income):"–")+'</td><td>'+(s.expense?yen(s.expense):"–")+
        '</td><td class="'+(bal>=0?"pos":"neg")+'">'+(s.income||s.expense?sign(bal):"–")+'</td></tr>';
    }).join("")+'</table></div>';}

  var brk='<div class="muted" style="margin:-4px 0 6px">内訳：株式 '+yen(M.stockVal)+'円（取得'+yen(M.stockCost)+'）＋ 投資信託 '+yen(M.fundVal)+'円（取得'+yen(M.fundCost)+'）／米国株は配当のみ集計</div>';
  dash.innerHTML='<div class="no-print" style="text-align:right;margin-bottom:6px">'+
    '<button class="btn" id="b-mail" style="margin-right:6px">✉️ Gmailで下書き作成</button>'+
    '<button class="btn ghost" id="b-mailto" style="margin-right:6px">宛先変更</button>'+
    '<button class="btn ghost" onclick="window.print()">🖨 PDF/印刷</button></div>'+
    kpi+brk+divChart+divMonthChart+budget+'<h2>推移（記録の積み上げ）</h2>'+trends+tbl;

  updateBudgetSum();
  document.getElementById("b-save").onclick=function(){
    var ymv=document.getElementById("i-ym").value||ym;
    var s=snaps();var m=curMetrics(parseInt(ymv));
    s[ymv]={asset:m.asset,stockVal:m.stockVal,stockCost:m.stockCost,fundVal:m.fundVal,onkabu:m.onkabu,
      divYTD:m.divYTD,divMonth:(D.byMonth[ymv]?D.byMonth[ymv].dom+D.byMonth[ymv].us:0),
      lifeDiv:m.lifeDiv,unreal:m.unreal,remYears:m.remYears===Infinity?null:m.remYears,
      income:n(document.getElementById("i-inc").value),expense:n(document.getElementById("i-exp").value),auto:false};
    saveSnaps(s);render();
  };
  document.getElementById("b-del").onclick=function(){
    var ymv=document.getElementById("i-ym").value;var s=snaps();
    if(s[ymv]&&confirm(ymv+" の記録を削除しますか？")){delete s[ymv];saveSnaps(s);render();}
  };
  ["i-inc","i-exp"].forEach(function(id){document.getElementById(id).oninput=updateBudgetSum;});
  document.getElementById("i-ym").onchange=function(){targetYM=this.value;render();};
  document.getElementById("b-mail").onclick=function(){
    var inc=n(document.getElementById("i-inc").value),exp=n(document.getElementById("i-exp").value);
    window.open(buildMail(ym,M,inc,exp),"_blank");
  };
  document.getElementById("b-mailto").onclick=function(){
    var v=prompt("メール下書きの宛先アドレス",mailAddr());
    if(v){localStorage.setItem("mmr_email",v.trim());alert("宛先を "+v.trim()+" に設定しました。");}
  };
}
function updateBudgetSum(){
  var inc=n((document.getElementById("i-inc")||{}).value),exp=n((document.getElementById("i-exp")||{}).value);
  var el=document.getElementById("budget-sum");if(!el)return;
  if(!inc&&!exp){el.textContent="収入・支出を入力すると収支と貯蓄率を表示します。";return;}
  var bal=inc-exp,rate=inc?bal/inc*100:0;
  el.innerHTML='収支 <b class="'+(bal>=0?"pos":"neg")+'">'+sign(bal)+'円</b>　貯蓄率 <b>'+p1(rate)+'%</b>';
}
function m(k,v){return '<div><div class="k">'+k+'</div><div class="mv">'+v+'</div></div>';}
function box(l,v){return '<div class="box"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}

function readText(buf){
  var txt=new TextDecoder("shift_jis").decode(buf);
  // 文字化け(置換文字多数)ならUTF-8で再デコード
  var bad=(txt.match(/�/g)||[]).length;
  if(bad>3||(txt.indexOf("日付")<0&&txt.indexOf("受渡")<0&&txt.indexOf("保有")<0&&txt.indexOf("約定")<0&&txt.indexOf("計算対象")<0)){
    try{var u=new TextDecoder("utf-8").decode(buf);
      if((u.match(/�/g)||[]).length<bad||/日付|受渡|保有|約定|計算対象/.test(u))txt=u;}catch(e){}}
  return txt;
}
function handleFiles(fileList){
  var arr=Array.prototype.slice.call(fileList).filter(function(f){return /\.csv$/i.test(f.name);});
  if(!arr.length)return;var done=0;
  arr.forEach(function(f){var rd=new FileReader();
    rd.onload=function(){var rows=parseCSV(readText(rd.result)),kind=detectType(rows);
      if(kind=="hold")DATA.hold=parseHoldings(rows);
      else if(kind=="div")DATA.div=parseDiv(rows);
      else if(kind=="mf")DATA.mf=parseMF(rows);
      DATA.files=DATA.files.filter(function(x){return x.name!==f.name;});
      DATA.files.push({name:f.name,kind:kind});
      if(++done===arr.length)afterLoad();};
    rd.readAsArrayBuffer(f);});
}
function afterLoad(){
  if(!targetYM)targetYM=prevMonthYM();
  // 月初に先月レポートを自動生成・自動記録
  if(DATA.hold&&DATA.div){autoRecord(targetYM);}
  render();
}
function autoRecord(ym){
  var s=snaps(),m=curMetrics(parseInt(ym));
  var mfm=DATA.mf&&DATA.mf.byMonth[ym], prev=s[ym]||{};
  s[ym]={asset:m.asset,stockVal:m.stockVal,stockCost:m.stockCost,fundVal:m.fundVal,onkabu:m.onkabu,
    divYTD:m.divYTD,divMonth:(DATA.div.byMonth[ym]?DATA.div.byMonth[ym].dom+DATA.div.byMonth[ym].us:0),
    lifeDiv:m.lifeDiv,unreal:m.unreal,remYears:m.remYears===Infinity?null:m.remYears,
    income:mfm?Math.round(mfm.income):(prev.income||0),
    expense:mfm?Math.round(mfm.expense):(prev.expense||0),auto:true};
  saveSnaps(s);
}
function renderFileList(){
  var el=document.getElementById("filelist");if(!el)return;
  el.innerHTML=DATA.files.map(function(f){
    var cls=f.kind=="unknown"?"warn":"ok";
    return '<span class="chip '+cls+'">'+(f.kind=="unknown"?"⚠ ":"✓ ")+esc(kindLabel(f.kind))+'：'+esc(f.name)+'</span>';
  }).join("")+(DATA.files.length?'<button class="btn ghost" style="font-size:12px;padding:4px 10px" id="b-clearfiles">クリア</button>':'');
  var cb=document.getElementById("b-clearfiles");
  if(cb)cb.onclick=function(){DATA={hold:null,div:null,mf:null,files:[]};render();};
}
function initDrop(){
  var dz=document.getElementById("dropzone"),inp=document.getElementById("f-multi");
  if(!dz)return;
  inp.addEventListener("change",function(e){handleFiles(e.target.files);e.target.value="";});
  ["dragenter","dragover"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("over");});});
  ["dragleave","drop"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("over");});});
  dz.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)handleFiles(e.dataTransfer.files);});
}
initDrop();
if(Object.keys(snaps()).length){targetYM=prevMonthYM();render();}
</script>
</body>
</html>
