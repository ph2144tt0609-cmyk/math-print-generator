<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f1ff"/>
      <stop offset="1" stop-color="#eafbe6"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5630"/>
      <stop offset="1" stop-color="#43280f"/>
    </linearGradient>
    <linearGradient id="bodyG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b3f1d"/>
      <stop offset="1" stop-color="#3a2210"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4a28"/>
      <stop offset="1" stop-color="#43290f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cfeeff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- かわいい かぶとむし（おす）横向き -->
    <symbol id="beetleM" viewBox="0 0 250 200">
      <g stroke="#2e1c0e" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M72 150 q-20 16 -42 12"/>
        <path d="M98 160 q-10 26 -30 30"/>
        <path d="M124 160 q2 28 -10 38"/>
        <path d="M150 152 q20 18 40 12"/>
        <path d="M168 142 q26 8 46 -2"/>
      </g>
      <ellipse cx="98" cy="112" rx="80" ry="54" fill="url(#bodyG)"/>
      <path d="M30 112 H160" stroke="#241407" stroke-width="3" opacity="0.5"/>
      <ellipse cx="72" cy="88" rx="30" ry="15" fill="#ffffff" opacity="0.18"/>
      <ellipse cx="170" cy="100" rx="36" ry="31" fill="url(#bodyG2)"/>
      <ellipse cx="202" cy="98" rx="21" ry="18" fill="#321e0d"/>
      <path d="M190 92 C 208 84 216 78 220 66" stroke="#2b1a0d" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M200 80 C 218 56 226 50 228 36" stroke="#2b1a0d" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M228 36 L 214 16" stroke="#2b1a0d" stroke-width="9" stroke-linecap="round"/>
      <path d="M228 36 L 244 20" stroke="#2b1a0d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="205" cy="100" r="5.5" fill="#fff"/>
      <circle cx="206" cy="101" r="3" fill="#1a1008"/>
    </symbol>

    <!-- かわいい かぶとむし（めす）横向き -->
    <symbol id="beetleF" viewBox="0 0 250 200">
      <g stroke="#2e1c0e" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M72 150 q-20 16 -42 12"/>
        <path d="M98 160 q-10 26 -30 30"/>
        <path d="M124 160 q2 28 -10 38"/>
        <path d="M150 152 q20 18 40 12"/>
        <path d="M168 142 q26 8 46 -2"/>
      </g>
      <ellipse cx="98" cy="112" rx="80" ry="54" fill="url(#bodyG)"/>
      <path d="M30 112 H160" stroke="#241407" stroke-width="3" opacity="0.5"/>
      <ellipse cx="72" cy="88" rx="30" ry="15" fill="#ffffff" opacity="0.18"/>
      <ellipse cx="170" cy="100" rx="36" ry="31" fill="url(#bodyG2)"/>
      <ellipse cx="202" cy="98" rx="21" ry="18" fill="#321e0d"/>
      <path d="M196 86 C 206 80 212 78 218 80" stroke="#2b1a0d" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="205" cy="100" r="5.5" fill="#fff"/>
      <circle cx="206" cy="101" r="3" fill="#1a1008"/>
    </symbol>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <circle cx="120" cy="120" r="60" fill="#ffe680"/>
  <circle cx="120" cy="120" r="60" fill="#fff3b0" opacity="0.5"/>
  <!-- 森のかざり -->
  <g opacity="0.9">
    <ellipse cx="60" cy="930" rx="120" ry="90" fill="#9ad36a"/>
    <ellipse cx="950" cy="940" rx="130" ry="95" fill="#9ad36a"/>
    <circle cx="900" cy="170" r="46" fill="#7cc451"/>
    <circle cx="940" cy="210" r="38" fill="#8fd067"/>
    <rect x="912" y="205" width="16" height="60" rx="6" fill="#7a5230"/>
    <circle cx="70" cy="430" r="40" fill="#8fd067"/>
    <circle cx="40" cy="470" r="30" fill="#7cc451"/>
  </g>
  <g fill="#74c24a" opacity="0.85">
    <path d="M160 980 q20 -50 60 -40 q-30 18 -22 50 z"/>
    <path d="M820 985 q24 -54 66 -42 q-34 20 -24 54 z"/>
  </g>

  <!-- タイトル -->
  <rect x="170" y="34" width="660" height="92" rx="46" fill="#2e7d32"/>
  <rect x="170" y="34" width="660" height="92" rx="46" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="500" y="98" text-anchor="middle" font-size="54" font-weight="bold" fill="#ffffff">かぶとむしの そだてかた</text>

  <!-- 家（やね） -->
  <path d="M200 200 L500 138 L800 200 Z" fill="#c46a3a"/>
  <path d="M200 200 L500 138 L800 200 Z" fill="none" stroke="#8a4a23" stroke-width="5"/>

  <!-- 家本体（とうめい） -->
  <rect x="220" y="196" width="560" height="710" rx="26" fill="url(#glass)" stroke="#7fb6d6" stroke-width="6"/>
  <line x1="220" y1="540" x2="780" y2="540" stroke="#7fb6d6" stroke-width="5" stroke-dasharray="2 0"/>

  <!-- かい ラベル -->
  <g>
    <rect x="176" y="330" width="92" height="56" rx="14" fill="#1976d2"/>
    <text x="222" y="369" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff">2かい</text>
    <rect x="176" y="596" width="92" height="56" rx="14" fill="#8d6e63"/>
    <text x="222" y="635" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff">1かい</text>
  </g>

  <!-- ====== 2かい ====== -->
  <!-- のぼり木 -->
  <g>
    <rect x="300" y="300" width="26" height="220" rx="12" fill="#8a5a2c" transform="rotate(-8 313 410)"/>
    <rect x="470" y="320" width="24" height="200" rx="12" fill="#9a6634" transform="rotate(6 482 420)"/>
    <rect x="610" y="300" width="26" height="220" rx="12" fill="#7d4f27" transform="rotate(-4 623 410)"/>
  </g>
  <!-- 昆虫ゼリー 2こ -->
  <g>
    <rect x="350" y="486" width="44" height="34" rx="6" fill="#fff8e1" stroke="#caa64b" stroke-width="3"/>
    <rect x="354" y="494" width="36" height="22" rx="4" fill="#ffd54a"/>
    <rect x="560" y="486" width="44" height="34" rx="6" fill="#fff8e1" stroke="#caa64b" stroke-width="3"/>
    <rect x="564" y="494" width="36" height="22" rx="4" fill="#ffca28"/>
  </g>
  <!-- おす・めす -->
  <use href="#beetleM" x="300" y="350" width="200" height="160"/>
  <use href="#beetleF" x="520" y="372" width="170" height="136"/>
  <text x="372" y="345" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">おす</text>
  <text x="585" y="368" text-anchor="middle" font-size="22" font-weight="bold" fill="#c2185b">めす</text>

  <!-- 2かい 説明ふきだし -->
  <g>
    <rect x="232" y="232" width="150" height="50" rx="25" fill="#fff" stroke="#1976d2" stroke-width="4"/>
    <text x="307" y="266" text-anchor="middle" font-size="30" font-weight="bold" fill="#1976d2">たべる</text>
    <rect x="620" y="232" width="150" height="50" rx="25" fill="#fff" stroke="#1976d2" stroke-width="4"/>
    <text x="695" y="266" text-anchor="middle" font-size="30" font-weight="bold" fill="#1976d2">あるく</text>
  </g>

  <!-- ====== 1かい ====== -->
  <!-- マット（土） -->
  <path d="M226 700
           q40 -22 80 0 q40 22 80 0 q40 -22 80 0 q40 22 80 0 q40 -22 80 0 q40 22 80 0
           L774 900 L226 900 Z" fill="url(#soil)"/>
  <g fill="#5b3a1d" opacity="0.7">
    <circle cx="320" cy="780" r="6"/><circle cx="470" cy="820" r="5"/>
    <circle cx="600" cy="770" r="6"/><circle cx="690" cy="830" r="5"/>
    <circle cx="380" cy="850" r="5"/>
  </g>
  <!-- もぐっている かぶとむし（半分） -->
  <g>
    <ellipse cx="430" cy="715" rx="70" ry="40" fill="url(#bodyG)"/>
    <ellipse cx="412" cy="700" rx="24" ry="11" fill="#fff" opacity="0.18"/>
    <ellipse cx="500" cy="708" rx="30" ry="24" fill="url(#bodyG2)"/>
    <path d="M520 704 C 538 690 546 682 548 668" stroke="#2b1a0d" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M548 668 L 536 650" stroke="#2b1a0d" stroke-width="8" stroke-linecap="round"/>
    <path d="M548 668 L 562 654" stroke="#2b1a0d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- マットの高さ メモリ -->
  <g stroke="#fff" stroke-width="3">
    <line x1="250" y1="710" x2="250" y2="888"/>
    <line x1="244" y1="710" x2="256" y2="710"/>
    <line x1="244" y1="888" x2="256" y2="888"/>
  </g>
  <text x="262" y="810" font-size="22" font-weight="bold" fill="#fff" transform="rotate(0)">10〜15cm</text>

  <!-- 1かい 説明ふきだし -->
  <g>
    <rect x="540" y="610" width="150" height="50" rx="25" fill="#fff" stroke="#8d6e63" stroke-width="4"/>
    <text x="615" y="644" text-anchor="middle" font-size="30" font-weight="bold" fill="#6d4c41">ねる</text>
    <rect x="610" y="760" width="160" height="50" rx="25" fill="#fff" stroke="#8d6e63" stroke-width="4"/>
    <text x="690" y="794" text-anchor="middle" font-size="30" font-weight="bold" fill="#6d4c41">もぐる</text>
  </g>

  <!-- 下の ひとこと -->
  <rect x="150" y="930" width="700" height="54" rx="27" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="500" y="967" text-anchor="middle" font-size="30" font-weight="bold" fill="#2e7d32">2かいで あそんで、1かいで やすむよ！</text>
</svg>
