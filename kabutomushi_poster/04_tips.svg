<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffde7"/><stop offset="1" stop-color="#e8f9e6"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg4)"/>
  <g opacity="0.45" fill="#cfeeb5"><circle cx="60" cy="120" r="50"/><circle cx="950" cy="80" r="44"/><circle cx="930" cy="940" r="60"/></g>

  <!-- タイトル -->
  <rect x="120" y="34" width="760" height="100" rx="50" fill="#2e7d32"/>
  <rect x="120" y="34" width="760" height="100" rx="50" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="500" y="86" text-anchor="middle" font-size="46" font-weight="bold" fill="#fff">元気に 育てる</text>
  <text x="500" y="124" text-anchor="middle" font-size="30" font-weight="bold" fill="#c8e6c9">4つの コツ</text>

  <!-- ① 日かげ -->
  <g transform="translate(70,170)">
    <rect width="400" height="320" rx="28" fill="#e8f5e9" stroke="#66bb6a" stroke-width="6"/>
    <circle cx="56" cy="56" r="34" fill="#2e7d32"/>
    <text x="56" y="69" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">1</text>
    <rect x="166" y="120" width="20" height="58" rx="6" fill="#8a5a2c"/>
    <circle cx="176" cy="106" r="48" fill="#66bb6a"/>
    <circle cx="138" cy="124" r="30" fill="#7cc451"/>
    <circle cx="214" cy="124" r="30" fill="#7cc451"/>
    <ellipse cx="176" cy="190" rx="60" ry="12" fill="#9e9e9e" opacity="0.35"/>
    <text x="200" y="248" text-anchor="middle" font-size="48" font-weight="bold" fill="#2e7d32">日かげ</text>
    <text x="200" y="294" text-anchor="middle" font-size="24" fill="#5a6a55">すずしい 場しょに おく</text>
  </g>

  <!-- ② マット -->
  <g transform="translate(530,170)">
    <rect width="400" height="320" rx="28" fill="#efe6dd" stroke="#a1887f" stroke-width="6"/>
    <circle cx="56" cy="56" r="34" fill="#6d4c41"/>
    <text x="56" y="69" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">2</text>
    <path d="M120 120 q35 -18 70 0 q35 18 70 0 q15 -8 30 -2 L290 200 L120 200 Z" fill="#6f4a28"/>
    <g fill="#43290f" opacity="0.6"><circle cx="160" cy="160" r="6"/><circle cx="220" cy="175" r="5"/><circle cx="260" cy="155" r="6"/></g>
    <text x="200" y="248" text-anchor="middle" font-size="48" font-weight="bold" fill="#6d4c41">マット</text>
    <text x="200" y="294" text-anchor="middle" font-size="24" fill="#6a5a4a">土を あつく 入れる</text>
  </g>

  <!-- ③ ゼリー -->
  <g transform="translate(70,530)">
    <rect width="400" height="320" rx="28" fill="#fff8e1" stroke="#ffca28" stroke-width="6"/>
    <circle cx="56" cy="56" r="34" fill="#f9a825"/>
    <text x="56" y="69" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">3</text>
    <rect x="150" y="110" width="100" height="86" rx="10" fill="#fff" stroke="#caa64b" stroke-width="5"/>
    <rect x="160" y="132" width="80" height="58" rx="8" fill="#ffca28"/>
    <ellipse cx="200" cy="110" rx="50" ry="12" fill="#fff3cd" stroke="#caa64b" stroke-width="4"/>
    <text x="200" y="248" text-anchor="middle" font-size="48" font-weight="bold" fill="#c98a00">ゼリー</text>
    <text x="200" y="294" text-anchor="middle" font-size="24" fill="#8a7340">毎日 チェックする</text>
  </g>

  <!-- ④ のぼり木 -->
  <g transform="translate(530,530)">
    <rect width="400" height="320" rx="28" fill="#efebe9" stroke="#8d6e63" stroke-width="6"/>
    <circle cx="56" cy="56" r="34" fill="#5d4037"/>
    <text x="56" y="69" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">4</text>
    <rect x="150" y="100" width="24" height="100" rx="11" fill="#8a5a2c" transform="rotate(-10 162 150)"/>
    <rect x="188" y="100" width="24" height="100" rx="11" fill="#9a6634"/>
    <rect x="226" y="100" width="24" height="100" rx="11" fill="#7d4f27" transform="rotate(10 238 150)"/>
    <text x="200" y="248" text-anchor="middle" font-size="44" font-weight="bold" fill="#5d4037">のぼり木</text>
    <text x="200" y="294" text-anchor="middle" font-size="24" fill="#6a5a52">2〜3本 立てる</text>
  </g>

  <!-- 下 まとめ -->
  <rect x="90" y="890" width="820" height="78" rx="39" fill="#ff7043"/>
  <rect x="90" y="890" width="820" height="78" rx="39" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="500" y="942" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff">これを まもると 元気に 育つ！</text>
</svg>
