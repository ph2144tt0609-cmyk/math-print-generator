<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="'Hiragino Maru Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#eafbe6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg2)"/>
  <g opacity="0.5" fill="#cde6b0">
    <circle cx="60" cy="60" r="50"/><circle cx="940" cy="120" r="60"/>
    <circle cx="980" cy="900" r="70"/><circle cx="40" cy="930" r="55"/>
  </g>

  <!-- タイトル -->
  <rect x="140" y="34" width="720" height="92" rx="46" fill="#ef6c00"/>
  <rect x="140" y="34" width="720" height="92" rx="46" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="500" y="98" text-anchor="middle" font-size="50" font-weight="bold" fill="#fff">お世話の 7つの コツ</text>

  <!-- カード テンプレ：g(transform)で配置 -->
  <!-- 1 日なたは× -->
  <g transform="translate(60,160)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#ffcc80" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#fff3cd"/>
    <circle cx="92" cy="85" r="26" fill="#ffca28"/>
    <g stroke="#ffb300" stroke-width="6" stroke-linecap="round">
      <line x1="92" y1="32" x2="92" y2="46"/><line x1="92" y1="124" x2="92" y2="138"/>
      <line x1="39" y1="85" x2="53" y2="85"/><line x1="131" y1="85" x2="145" y2="85"/>
      <line x1="55" y1="48" x2="64" y2="57"/><line x1="120" y1="113" x2="129" y2="122"/>
      <line x1="129" y1="48" x2="120" y2="57"/><line x1="64" y1="113" x2="55" y2="122"/>
    </g>
    <g stroke="#e53935" stroke-width="9" stroke-linecap="round">
      <line x1="60" y1="53" x2="124" y2="117"/><line x1="124" y1="53" x2="60" y2="117"/>
    </g>
    <text x="180" y="78" font-size="34" font-weight="bold" fill="#5d4037">日なたは ×</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">あつくなりすぎ ちゅうい</text>
  </g>

  <!-- 2 日かげにおく -->
  <g transform="translate(510,160)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#a5d6a7" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#e6f4d8"/>
    <rect x="86" y="92" width="14" height="40" rx="4" fill="#8a5a2c"/>
    <circle cx="93" cy="68" r="34" fill="#66bb6a"/>
    <circle cx="70" cy="80" r="22" fill="#7cc451"/>
    <circle cx="116" cy="80" r="22" fill="#7cc451"/>
    <ellipse cx="93" cy="140" rx="40" ry="9" fill="#9e9e9e" opacity="0.4"/>
    <text x="180" y="78" font-size="34" font-weight="bold" fill="#2e7d32">日かげに おく</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">すずしい 場しょが すき</text>
  </g>

  <!-- 3 土をかわかさない -->
  <g transform="translate(60,350)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#90caf9" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#e3f2fd"/>
    <path d="M92 44 C 118 78 124 96 124 108 a32 32 0 1 1 -64 0 c0 -12 6 -30 32 -64 Z" fill="#42a5f5"/>
    <ellipse cx="80" cy="100" rx="8" ry="12" fill="#bbdefb" opacity="0.8"/>
    <text x="180" y="78" font-size="34" font-weight="bold" fill="#1565c0">土を かわかさない</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">きりふきで しめらせる</text>
  </g>

  <!-- 4 ゼリーを毎日チェック -->
  <g transform="translate(510,350)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#ffe082" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#fff8e1"/>
    <rect x="62" y="60" width="62" height="56" rx="8" fill="#ffffff" stroke="#caa64b" stroke-width="4"/>
    <rect x="68" y="74" width="50" height="38" rx="6" fill="#ffca28"/>
    <ellipse cx="93" cy="60" rx="31" ry="8" fill="#fff3cd" stroke="#caa64b" stroke-width="3"/>
    <text x="180" y="78" font-size="34" font-weight="bold" fill="#c98a00">ゼリーを 毎日</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">なくなったら 入れかえ</text>
  </g>

  <!-- 5 のぼり木を2〜3本 -->
  <g transform="translate(60,540)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#bcaaa4" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#efebe9"/>
    <rect x="64" y="50" width="18" height="72" rx="8" fill="#8a5a2c" transform="rotate(-10 73 86)"/>
    <rect x="86" y="50" width="18" height="72" rx="8" fill="#9a6634"/>
    <rect x="104" y="50" width="18" height="72" rx="8" fill="#7d4f27" transform="rotate(10 113 86)"/>
    <text x="180" y="78" font-size="34" font-weight="bold" fill="#5d4037">のぼり木 2〜3本</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">ひっくり返っても 起きられる</text>
  </g>

  <!-- 6 フンがふえたら土こうかん -->
  <g transform="translate(510,540)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#a1887f" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#efe3da"/>
    <rect x="68" y="92" width="48" height="30" rx="6" fill="#8d6e63"/>
    <g fill="#5d4037"><circle cx="78" cy="70" r="7"/><circle cx="96" cy="62" r="7"/><circle cx="110" cy="74" r="7"/><circle cx="92" cy="80" r="7"/></g>
    <path d="M124 56 l14 -14" stroke="#43a047" stroke-width="6" stroke-linecap="round"/>
    <path d="M138 42 l8 4 -4 8 z" fill="#43a047"/>
    <text x="180" y="78" font-size="33" font-weight="bold" fill="#5d4037">フンが ふえたら</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">土を こうかんする</text>
  </g>

  <!-- 7 おすどうしはけんか -->
  <g transform="translate(285,730)">
    <rect width="430" height="170" rx="22" fill="#fff" stroke="#ef9a9a" stroke-width="5"/>
    <circle cx="92" cy="85" r="58" fill="#ffebee"/>
    <ellipse cx="74" cy="92" rx="26" ry="18" fill="#6b3f1d"/>
    <path d="M88 86 l20 -16" stroke="#3a2210" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="118" cy="92" rx="26" ry="18" fill="#8a5630"/>
    <path d="M104 86 l-20 -16" stroke="#3a2210" stroke-width="9" stroke-linecap="round"/>
    <text x="96" y="56" font-size="30" font-weight="bold" fill="#e53935">!</text>
    <text x="180" y="78" font-size="32" font-weight="bold" fill="#c62828">おすどうしは</text>
    <text x="180" y="120" font-size="24" fill="#7a6a5a">けんかに ちゅうい</text>
  </g>
</svg>
